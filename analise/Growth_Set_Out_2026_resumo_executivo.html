<title>Resumo Executivo Growth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Conceito: palco 16:9 escalável, coluna de leitura à esquerda e gráfico limpo à direita; um destaque por slide. */
:root{
  --bg:#E9ECF1; --stage:#FFFFFF; --ink:#1B2230; --ink2:#47505F; --muted:#7A8394; --line:#E2E6EC; --soft:#F4F6F9;
  --brand:#B70701; --cro-bg:#FDF1F0; --cro-tx:#B70701; --c-all:#3A4354; --c-a:#2F6FED; --c-b:#F08A24; --ref:#BAC1CD; --meta:#CBD1DB;
  --pos:#14895A; --neg:#D4453B; --tipbg:#1B2230; --tipfg:#FFFFFF; --shadow:0 18px 50px rgba(20,30,50,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E14; --stage:#151A23; --ink:#EDF0F5; --ink2:#B7BFCD; --muted:#8892A3; --line:#273041; --soft:#1B2130;
    --cro-bg:#2B1A1D; --cro-tx:#FF8A82; --c-all:#C9D1DF; --c-a:#6C9BFF; --c-b:#FFA94D; --ref:#4A5568; --meta:#3A4456;
    --pos:#3DC48C; --neg:#FF6F66; --tipbg:#EDF0F5; --tipfg:#1B2230; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E14; --stage:#151A23; --ink:#EDF0F5; --ink2:#B7BFCD; --muted:#8892A3; --line:#273041; --soft:#1B2130;
  --cro-bg:#2B1A1D; --cro-tx:#FF8A82; --c-all:#C9D1DF; --c-a:#6C9BFF; --c-b:#FFA94D; --ref:#4A5568; --meta:#3A4456;
  --pos:#3DC48C; --neg:#FF6F66; --tipbg:#EDF0F5; --tipfg:#1B2230; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;padding-inline:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#viewport{flex:1;min-height:0;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--stage);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.slide{position:absolute;inset:0;display:none;padding:52px 64px 44px}
.slide.on{display:block;animation:fade .28s ease-out}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
.eyebrow .mes{padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink2);letter-spacing:.06em}
h1{margin:14px 0 0;font-size:38px;line-height:1.14;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:16px 0 0;font-size:18px;line-height:1.55;color:var(--ink2);font-weight:500;max-width:62ch}
.split{display:grid;grid-template-columns:360px 1fr;gap:40px;height:calc(100% - 4px)}
.split.wide{grid-template-columns:300px 1fr}
.left{display:flex;flex-direction:column;min-width:0}
.panel{background:var(--soft);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;min-width:0;min-height:0}
.panel .ptitle{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chart{flex:1;min-height:0;display:flex;flex-direction:column}
.chart svg{flex:1;min-height:0;width:100%;display:block}
.stat{margin-top:auto;padding-top:20px}
.stat .big{font-size:76px;font-weight:700;line-height:1;letter-spacing:-.03em}
.stat .big small{font-size:28px;font-weight:600;letter-spacing:0;margin-left:4px;color:var(--ink2)}
.stat .lab{margin-top:8px;font-size:15px;font-weight:500;color:var(--ink2)}
.stat .gap{margin-top:14px;display:inline-block;padding:6px 12px;border-radius:10px;font-weight:700;font-size:16px;background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.stat .gap.ok{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
svg text{font-family:'Montserrat',system-ui,sans-serif;fill:var(--ink2)}
svg .t-ink{fill:var(--ink)} svg .t-mut{fill:var(--muted)} svg .t-neg{fill:var(--neg)} svg .t-pos{fill:var(--pos)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .zero{stroke:var(--muted);stroke-width:1.2}
.bar{transition:opacity .15s}
svg:hover .bar{opacity:.6} svg .bar:hover{opacity:1}
/* resumo */
.cards{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto 1fr;gap:16px;margin-top:16px;height:calc(100% - 100px)}
.card{background:var(--soft);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.card .k{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0;font-size:14px;line-height:1.45;font-weight:500;color:var(--ink)}
.card .mini{margin-top:auto;padding-top:4px}
.cro{grid-column:1/-1;background:var(--cro-bg);border:2px solid var(--brand);border-radius:16px;padding:16px 22px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.cro .k{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cro-tx)}
.cro .k span{font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink2);font-size:14px}
.cro ul{list-style:none;margin:0;padding:0;display:grid;gap:20px 26px;flex:1;align-content:center}
.cro li{display:flex;gap:12px;align-items:flex-start;min-width:0}
.cro .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center}
.cro .ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cro b{display:block;font-size:17px;font-weight:800;color:var(--ink);line-height:1.3}
.cro li div span{display:block;font-size:14.5px;font-weight:500;color:var(--ink2);line-height:1.4;margin-top:2px}
.pri{display:grid;grid-template-columns:470px 1fr;gap:22px;margin-top:14px;height:calc(100% - 96px)}
.pri .mx{background:var(--soft);border-radius:16px;padding:12px 14px;min-width:0}
.pri .lst{display:flex;flex-direction:column;gap:6px;min-width:0}
.pri .hd,.pri .rw{display:grid;grid-template-columns:28px 76px 1fr 140px 56px;gap:10px;align-items:center}
.pri .hd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px}
.pri .rw{background:var(--soft);border-radius:12px;padding:5px 10px;min-height:46px}
.pri .rw b{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.25;display:block}
.pri .rw span.d{font-size:12px;color:var(--ink2);font-weight:500;line-height:1.3;display:block}
.pri .n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.pri .bd{font-size:12px;font-weight:700;color:var(--ink2)}
.pri .w{font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px;text-align:center;color:#fff}
.pri .foot{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.ex{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;margin-top:16px;height:calc(100% - 100px)}
.ex .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.ex .box{background:var(--soft);border-radius:16px;padding:16px 20px;min-width:0}
.ex .box .k{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.pb{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:10px;margin-bottom:10px}
.pb:last-child{margin-bottom:0}
.pb .l{font-size:14px;font-weight:600;color:var(--ink2)}
.pb .tr{position:relative;height:22px;background:var(--stage);border-radius:7px;border:1px solid var(--line)}
.pb .fl{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.pb .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.pb .v{font-size:22px;font-weight:800;color:var(--ink);text-align:right}
.kt{width:100%;border-collapse:collapse;font-size:16px}
.kt th{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 8px}
.kt th:first-child{text-align:left}
.kt td{padding:9px 0;border-top:1px solid var(--line);text-align:right;font-weight:700;color:var(--ink)}
.kt td:first-child{text-align:left;font-weight:600;color:var(--ink2)}
.kt .p{color:var(--pos)} .kt .n{color:var(--neg)} .kt .z{color:var(--muted);font-weight:600}
.ins{display:flex;flex-direction:column;gap:14px}
.ins .it{display:flex;gap:12px;align-items:flex-start}
.ins .it i{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;font-style:normal;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.ins .it p{margin:0;font-size:17px;line-height:1.5;font-weight:500;color:var(--ink)}
.ins .it p b{font-weight:800}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px;height:calc(100% - 100px)}
.tp .c{background:var(--soft);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0;border-top:5px solid var(--brand)}
.tp .c .h{display:flex;align-items:center;gap:12px}
.tp .c .h i{flex:none;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;font-style:normal;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.tp .c .h b{font-size:20px;font-weight:800;line-height:1.25;color:var(--ink)}
.tp .c .r{font-size:16px;line-height:1.45;font-weight:500;color:var(--ink)}
.tp .c .r em{display:block;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tp .c .imp{margin-top:auto;display:inline-block;align-self:flex-start;padding:7px 14px;border-radius:10px;font-weight:800;font-size:17px;background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.ini{display:flex;flex-direction:column;gap:14px;margin-top:16px;height:calc(100% - 100px)}
.ini .r{flex:1;display:grid;grid-template-columns:54px 1fr 210px 150px;gap:18px;align-items:center;background:var(--cro-bg);border:2px solid var(--brand);border-radius:16px;padding:12px 20px;min-height:0}
.ini .r:nth-child(n+2){border-color:color-mix(in srgb,var(--brand) 55%,transparent)}
.ini .ic{width:48px;height:48px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center}
.ini .ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ini b{display:block;font-size:21px;font-weight:800;color:var(--ink);line-height:1.3}
.ini .t span{display:block;font-size:16px;font-weight:500;color:var(--ink2);line-height:1.45;margin-top:3px}
.ini .g em,.ini .e em{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ini .g strong,.ini .e strong{font-size:17px;font-weight:800;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--stage);color:var(--ink2);border:1px solid var(--line)}
/* capa */
.cover{background:var(--brand);color:#fff;padding:0}
.cover .in{position:absolute;left:72px;top:150px;width:760px}
.cover h2{margin:0;font-size:66px;line-height:1.04;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.cover p{margin:22px 0 0;font-size:22px;font-weight:500;opacity:.92;max-width:34ch;line-height:1.45}
.cover .k{position:absolute;left:72px;bottom:56px;font-size:16px;font-weight:600;letter-spacing:.1em;opacity:.85}
.cover .bars{position:absolute;right:64px;bottom:0;display:flex;gap:16px;align-items:flex-end;height:520px}
.cover .bars span{display:block;width:44px;border-radius:12px 12px 0 0;background:rgba(255,255,255,.18)}
.cover .bars span.hi{background:#fff}
/* controles */
#bar{display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--stage);border-top:1px solid var(--line)}
#bar button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
#bar button:hover{background:var(--line)} #bar button:focus-visible,#menu button:focus-visible{outline:2px solid var(--c-a);outline-offset:2px}
#prog{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:60px}
#prog i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .25s}
#count{font-size:13px;font-weight:600;color:var(--muted);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
#menu{position:absolute;left:12px;bottom:12px;top:12px;width:300px;background:var(--stage);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;overflow:auto;z-index:20}
#menu h3{margin:6px 8px 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#menu button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:none;border:0;padding:7px 10px;border-radius:8px;cursor:pointer}
#menu button:hover,#menu button.cur{background:var(--soft)} #menu .sec{font-weight:700;margin-top:10px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--tipbg);color:var(--tipfg);font-size:13px;font-weight:500;line-height:1.4;padding:8px 11px;border-radius:9px;max-width:360px;opacity:0;transition:opacity .1s}
@media (max-width:640px){#bar button span.t{display:none} #menu{left:8px;right:8px;width:auto}}
</style>
<div id="app">
  <div id="viewport"><div id="stage" aria-live="polite"></div><div id="menu" hidden></div></div>
  <div id="bar">
    <button id="bMenu" aria-label="Índice">Índice</button>
    <button id="bPrev" aria-label="Slide anterior">&larr; <span class="t">Anterior</span></button>
    <div id="prog"><i></i></div>
    <div id="count">1 / 1</div>
    <button id="bNext" aria-label="Próximo slide"><span class="t">Próximo</span> &rarr;</button>
    <button id="bTheme" aria-label="Alternar tema">Tema</button>
    <button id="bFs" aria-label="Tela cheia">Tela cheia</button>
  </div>
</div>
<div id="tip"></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const nf=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const sg=v=>v>0?'+':(v<0?'-':'');
const fmtMil=(v,dec=0,plus=false)=>{const a=Math.abs(v);const s=(dec?nf1.format(a):nf.format(a));return (v<0?'-':(plus&&v>0?'+':''))+'R$ '+s+' mil'};
const fmtPct=(v,plus=true)=>(plus?sg(v):(v<0?'-':''))+nf.format(Math.abs(v))+'%';
const fmtPP=v=>sg(v)+nf1.format(Math.abs(v))+' p.p.';
const NS='http://www.w3.org/2000/svg';
function S(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function H(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
const tip=$('#tip');
function bindTip(el,text){el.addEventListener('mousemove',e=>{tip.textContent=text;tip.style.opacity=1;const w=tip.offsetWidth;let x=e.clientX+14;if(x+w>innerWidth-8)x=e.clientX-w-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=(e.clientY+16)+'px'});el.addEventListener('mouseleave',()=>{tip.style.opacity=0})}
const COLOR={'Geral':'var(--c-all)','Mobile':'var(--c-a)','Android':'var(--c-a)','Desktop':'var(--c-b)','iOS':'var(--c-b)','vs 03-07/09':'var(--ref)','vs 24-28/09':'var(--c-a)','Média diária 01-05':'var(--ref)','06/10 (parcial)':'var(--c-b)'};
function wrap(label,max){const w=label.split(' ');const lines=[];let cur='';for(const x of w){if((cur+' '+x).trim().length>max&&cur){lines.push(cur);cur=x}else cur=(cur+' '+x).trim()}if(cur)lines.push(cur);return lines}
function roundedBar(x,y0,y1,w,r,up){ // barra com cantos arredondados só na ponta
  const top=Math.min(y0,y1),bot=Math.max(y0,y1),h=bot-top;r=Math.min(r,h/2,w/2);
  if(up) return `M${x},${bot}V${top+r}Q${x},${top} ${x+r},${top}H${x+w-r}Q${x+w},${top} ${x+w},${top+r}V${bot}Z`;
  return `M${x},${top}V${bot-r}Q${x},${bot} ${x+r},${bot}H${x+w-r}Q${x+w},${bot} ${x+w},${bot-r}V${top}Z`}
function niceTicks(min,max,n){const span=max-min;const raw=span/n;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;const step=(f<1.5?1:f<3?2:f<7?5:10)*p;const t=[];for(let v=Math.ceil(min/step)*step;v<=max+1e-9;v+=step)t.push(Math.round(v*1e6)/1e6);return t}

/* ---------- gráficos ---------- */
function waterfall(host,o){
  const W=760,H=460,m={l:14,r:92,t:56,b:70};const svg=S('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'xMidYMid meet'},host);
  let level=0;const bars=[];const lv=[];
  o.steps.forEach(s=>{if(s.type==='total'){level=s.v;bars.push({...s,y0:0,y1:s.v});}else{const n=level+s.v;bars.push({...s,y0:level,y1:n});level=n}lv.push(level)});
  if(o.meta!=null) bars.push({label:'Meta',v:o.meta,type:'meta',y0:0,y1:o.meta});
  const max=Math.max(...bars.map(b=>Math.max(b.y0,b.y1)))*1.1;
  const iw=W-m.l-m.r,ih=H-m.t-m.b;const y=v=>m.t+ih*(1-v/max);const band=iw/bars.length,bw=band*0.58;
  S('line',{class:'zero',x1:m.l,x2:W-m.r,y1:y(0),y2:y(0)},svg);
  bars.forEach((b,i)=>{
    const cx=m.l+band*(i+.5),x=cx-bw/2;const up=b.y1>=b.y0;
    let fill='var(--c-all)';if(b.type==='delta')fill=b.v>=0?'var(--pos)':'var(--neg)';if(b.type==='meta')fill='var(--meta)';
    const p=S('path',{class:'bar',d:roundedBar(x,y(b.y0),y(b.y1),bw,5,up||b.type!=='delta'),fill},svg);
    const dec=o.dec||0;
    const val=b.type==='delta'?(b.v>0?'+':'-')+(dec?nf1.format(Math.abs(b.v)):nf.format(Math.abs(b.v))):(dec?nf1.format(b.v):nf.format(b.v));
    const topy=Math.min(y(b.y0),y(b.y1));
    S('text',{x:cx,y:topy-9,'text-anchor':'middle','font-size':15,'font-weight':700,class:b.type==='delta'?(b.v>=0?'t-pos':'t-neg'):'t-ink'},svg,val);
    const lines=wrap(b.label,13);lines.forEach((ln,j)=>S('text',{x:cx,y:y(0)+22+j*17,'text-anchor':'middle','font-size':13,'font-weight':600,class:'t-mut'},svg,ln));
    bindTip(p,`${b.label}: ${fmtMil(b.v,o.dec||0,b.type==='delta')}`);
  });
  if(o.meta!=null){
    const n=bars.length;const set=bars[n-2],meta=bars[n-1];const xr=m.l+band*(n-.5)+bw/2+16;
    const ys=y(set.y1),ym=y(meta.y1);
    S('line',{x1:m.l+band*(n-1.5)+bw/2,x2:xr+8,y1:ys,y2:ys,stroke:'var(--neg)','stroke-width':1.4,'stroke-dasharray':'4 4'},svg);
    S('line',{x1:m.l+band*(n-.5)-bw/2,x2:xr+8,y1:ym,y2:ym,stroke:'var(--neg)','stroke-width':1.4,'stroke-dasharray':'4 4'},svg);
    S('line',{x1:xr,x2:xr,y1:ym,y2:ys,stroke:'var(--neg)','stroke-width':2},svg);
    S('text',{x:xr+8,y:(ys+ym)/2-2,'font-size':13,'font-weight':700,class:'t-neg'},svg,'Gap');
    S('text',{x:xr+8,y:(ys+ym)/2+15,'font-size':13,'font-weight':700,class:'t-neg'},svg,(o.gap<0?'-':'+')+(o.dec?nf1.format(Math.abs(o.gap)):nf.format(Math.abs(o.gap))));
  }
}
function grouped(host,o){
  const W=760,HT=440,m={l:44,r:12,t:44,b:56};
  const wrapEl=H('div','legend','',host);
  o.series.forEach(s=>{H('span','',`<i style="background:${COLOR[s.name]||'var(--c-all)'}"></i>${s.name}`,wrapEl)});
  const svg=S('svg',{viewBox:`0 0 ${W} ${HT}`,preserveAspectRatio:'xMidYMid meet'},host);
  const all=o.series.flatMap(s=>s.vals);let mn=Math.min(0,...all),mx=Math.max(0,...all);const pad=(mx-mn)*.14||1;mn=mn<0?mn-pad:0;mx=mx>0?mx+pad:0;
  const ih=HT-m.t-m.b,iw=W-m.l-m.r;const y=v=>m.t+ih*(1-(v-mn)/(mx-mn));
  const ticks=niceTicks(mn,mx,5);
  ticks.forEach(t=>{S('line',{class:t===0?'zero':'grid',x1:m.l,x2:W-m.r,y1:y(t),y2:y(t)},svg);S('text',{x:m.l-8,y:y(t)+4,'text-anchor':'end','font-size':12,class:'t-mut'},svg,(o.unit==='pp'?nf1.format(t):nf.format(t))+(o.unit==='%'?'%':''))});
  const n=o.cats.length,band=iw/n,gw=band*.74,bw=gw/o.series.length-4;
  o.cats.forEach((c,i)=>{
    const gx=m.l+band*i+(band-gw)/2;
    o.series.forEach((s,j)=>{
      const v=s.vals[i];const x=gx+j*(gw/o.series.length)+2;const up=v>=0;
      const p=S('path',{class:'bar',d:roundedBar(x,y(0),y(v),bw,5,up),fill:COLOR[s.name]||'var(--c-all)'},svg);
      const lab=o.unit==='pp'?sg(v)+nf1.format(Math.abs(v)):(o.unit==='idx'?nf.format(v):fmtPct(v));
      S('text',{x:x+bw/2,y:up?y(v)-7:y(v)+16,'text-anchor':'middle','font-size':12.5,'font-weight':700,class:v<0&&o.unit!=='idx'?'t-ink':'t-ink'},svg,lab);
      if(s.tips)bindTip(p,s.tips[i]);
    });
    wrap(c,15).forEach((ln,k)=>S('text',{x:m.l+band*(i+.5),y:HT-m.b+26+k*16,'text-anchor':'middle','font-size':13,'font-weight':600,class:'t-mut'},svg,ln));
  });
  if(o.unit==='idx'){S('text',{x:m.l,y:12,'text-anchor':'start','font-size':11.5,class:'t-mut'},svg,'índice 100 = média diária de 01 a 05/10')}
}
function diverging(host,o){
  const rows=o.rows,rh=Math.min(44,Math.floor(400/rows.length));const W=800,H=rows.length*rh+24,lw=290;
  const svg=S('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'xMidYMid meet'},host);
  const vals=rows.map(r=>r.v);let mn=Math.min(0,...vals),mx=Math.max(0,...vals);const x0=lw+24,x1=W-70;
  const pad=(mx-mn)*.16;mn=mn<0?mn-pad:0;mx=mx>0?mx+pad:0;const x=v=>x0+(x1-x0)*(v-mn)/(mx-mn);
  niceTicks(mn,mx,4).forEach(t=>{S('line',{class:t===0?'zero':'grid',x1:x(t),x2:x(t),y1:6,y2:H-18},svg);S('text',{x:x(t),y:H-2,'text-anchor':'middle','font-size':11.5,class:'t-mut'},svg,(o.int?nf.format(t):nf1.format(t)).replace(/^-/,'-'))});
  rows.forEach((r,i)=>{
    const cy=10+rh*i+rh/2,bh=rh*.52;const pos=r.v>=0;
    const g=S('g',{},svg);
    const name=r.label.length>30?r.label.slice(0,29)+'…':r.label;
    S('circle',{cx:14,cy,r:5,fill:/mobile|Android/.test(r.dev)?'var(--c-a)':'var(--c-b)'},g);
    S('text',{x:28,y:cy+4,'font-size':14,'font-weight':600,class:'t-ink'},g,name);
    S('text',{x:lw+6,y:cy+4,'text-anchor':'end','font-size':12,class:'t-mut'},g,r.dev);
    const bx=pos?x(0):x(r.v),bwid=Math.max(2,Math.abs(x(r.v)-x(0)));
    const rect=S('rect',{class:'bar',x:bx,y:cy-bh/2,width:bwid,height:bh,rx:4,fill:pos?'var(--pos)':'var(--neg)'},g);
    const lab=(o.int?(r.v>0?'+':'-')+nf.format(Math.abs(r.v)):(r.v>0?'+':'-')+nf1.format(Math.abs(r.v)));
    S('text',{x:pos?bx+bwid+8:bx-8,y:cy+4.5,'text-anchor':pos?'start':'end','font-size':13,'font-weight':700,class:pos?'t-pos':'t-neg'},g,lab);
    bindTip(rect,r.tip);
  });
}
function bullets(host,o){ // linhas com barra de faturado e marca de meta
  const rows=o.rows,W=760,rh=96,H=rows.length*rh+30;const svg=S('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'xMidYMid meet'},host);
  const max=Math.max(...rows.map(r=>Math.max(r.meta,r.fat)))*1.12;const x0=150,x1=W-110;const x=v=>x0+(x1-x0)*v/max;
  rows.forEach((r,i)=>{
    const cy=26+rh*i+rh/2-6;const first=i===0;const pct=r.fat/r.meta*100;
    S('text',{x:0,y:cy+5,'font-size':16,'font-weight':first?700:600,class:first?'t-ink':'t-mut'},svg,r.lab);
    S('rect',{x:x0,y:cy-15,width:x1-x0,height:30,rx:8,fill:'var(--soft)',stroke:'var(--line)'},svg);
    const bar=S('rect',{class:'bar',x:x0,y:cy-15,width:Math.max(4,x(r.fat)-x0),height:30,rx:8,fill:first?'var(--c-a)':'var(--ref)'},svg);
    S('line',{x1:x(r.meta),x2:x(r.meta),y1:cy-24,y2:cy+24,stroke:'var(--ink)','stroke-width':2.5},svg);
    S('text',{x:x(r.meta),y:cy-30,'text-anchor':'middle','font-size':12,class:'t-mut'},svg,'meta '+nf1.format(r.meta));
    S('text',{x:x(r.fat)-8,y:cy+5,'text-anchor':'end','font-size':14,'font-weight':700,class:first?'':'t-ink',fill:first?'#fff':null},svg,nf1.format(r.fat));
    S('text',{x:W,y:cy+6,'text-anchor':'end','font-size':20,'font-weight':700,class:pct>=100?'t-pos':'t-ink'},svg,nf.format(pct)+'%');
    bindTip(bar,`${r.lab}: faturado ${fmtMil(r.fat,1)} · meta ${fmtMil(r.meta,1)} · ${nf.format(pct)}%`);

}
function atingimento(host,o){
  const rows=o.rows,W=800,gh=88,H=rows.length*gh+36;const svg=S('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'xMidYMid meet'},host);
  const max=140,x0=170,x1=W-20;const x=v=>x0+(x1-x0)*v/max;
  S('line',{x1:x(100),x2:x(100),y1:18,y2:H-6,stroke:'var(--ink)','stroke-width':1.5,'stroke-dasharray':'5 4'},svg);
  S('text',{x:x(100),y:12,'text-anchor':'middle','font-size':12,'font-weight':700,class:'t-ink'},svg,'meta 100%');

       ['Funil do desktop','Carrinho → checkout -5,8 p.p.; produto → carrinho -0,9 p.p. nos dois devices.','Pagamento → compra -11,7 p.p. e sessão → produto -4,1 p.p.; leitura indicativa.','Cerca de R$ 7 mil/mês*']],
  ini:[['ads','Sustentar o google / cpc','Devemos manter o investimento e o ritmo atual, que gera +R$ 3,1 mil no mobile e +R$ 1,8 mil no desktop.','Preserva o ganho de outubro','Baixo · contínuo'],
       ['desk','Desktop: carrinho, pagamento e ticket','Devemos corrigir carrinho → checkout e pagamento → compra e reforçar ticket (cross-sell, frete).','Cerca de R$ 7 mil/mês*','Médio · 2 a 6 semanas'],
       ['tag','Meta Ads no mobile','Devemos revisar criativos e públicos, que perderam sessões (-22%) e CVR em setembro.','Até R$ 4 mil/mês','Baixo · 1 a 2 semanas']],
  foot:'* Se o desktop voltasse ao ticket de agosto.'}];
const dcls=v=>v>0?'p':(v<0?'n':'z');
function kpiSlide(s,B,i){
  const fmtPct=(v)=>Math.abs(v)<1?(v<0?'-':'+')+nf1.format(Math.abs(v))+'%':(v<0?'-':'+')+nf.format(Math.abs(v))+'%';
  const S_=B.set,O=B.out,sv=S_.delta.series[0].vals;
  const oFat=O.gap[0],oAt=oFat.fat/oFat.meta*100,oRef=O.gap[2];
  let ov;if(B.app){ov=[ (oFat.fat/oRef.fat-1)*100, O.delta.series[1].vals[0], -25.5, null]}else ov=O.delta.series[0].vals;
  const cell=v=>v==null?'<td class="z">n/d</td>':`<td class="${dcls(v)}">${fmtPct(v)}</td>`;
  s.innerHTML=`${eyebrow(B.short,'Setembro e 01 a 05/10')}<h1>${B.short}: panorama e leitura</h1><div class="ex"><div class="col"><div class="box"><div class="k">Faturado sobre a meta</div></div><div class="box"><div class="k">Variação das métricas</div></div></div><div class="col"><div class="box ins" style="flex:1"><div class="k">Principais insights</div></div></div></div>`;
  const boxes=s.querySelectorAll('.box');
  [['Setembro',S_.gap.ating],['01 a 05/10',oAt]].forEach(a=>{const col=a[1]>=100?'var(--pos)':'var(--c-b)';boxes[0].insertAdjacentHTML('beforeend',`<div class="pb"><span class="l">${a[0]}</span><div class="tr"><div class="fl" style="width:${Math.min(a[1],140)/140*100}%;background:${a[0]==='Setembro'?'var(--c-a)':col}"></div><div class="mk" style="left:${100/140*100}%"></div></div><span class="v">${nf.format(a[1])}%</span></div>`)});
  boxes[0].insertAdjacentHTML('beforeend','<div style="font-size:11.5px;color:var(--muted);font-weight:600;text-align:right">Marca vertical: 100% da meta</div>');
  const fat=`R$ ${nf1.format(S_.gap.fat)} mil`,ofat=`R$ ${nf1.format(oFat.fat)} mil`;
  boxes[1].insertAdjacentHTML('beforeend',`<table class="kt"><tr><th></th><th>Setembro vs agosto</th><th>01-05/10 vs 24-28/09</th></tr>
   <tr><td>Faturado</td><td>R$ ${nf.format(S_.gap.fat)} mil</td><td>R$ ${nf1.format(oFat.fat)} mil${B.app?'':''}</td></tr>
   <tr><td>${B.app?'Receita (faturado)':'Receita captada'}</td><td class="${dcls(sv[0])}">${fmtPct(sv[0])}</td>${cell(ov[0])}</tr>
   <tr><td>Sessões</td><td class="${dcls(sv[1])}">${fmtPct(sv[1])}</td>${cell(ov[1])}</tr>
   <tr><td>CVR</td><td class="${dcls(sv[2])}">${fmtPct(sv[2])}</td>${cell(ov[2])}</tr>
   <tr><td>TKM</td><td class="${dcls(sv[3])}">${fmtPct(sv[3])}</td>${cell(ov[3])}</tr></table>${B.app?'<div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-top:8px">CVR de outubro = compradores únicos por sessão; TKM n/d (compra duplicada desde 25/09).</div>':'<div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-top:8px">Faturado de outubro ainda em maturação.</div>'}`);
  const ins=boxes[2];EX[i].ins.forEach((t,k)=>ins.insertAdjacentHTML('beforeend',`<div class="it"><i>${k+1}</i><p>${t}</p></div>`));
}
function topSlide(s,B,i){
  s.innerHTML=`${eyebrow(B.short,'Setembro x outubro')}<h1>${B.short}: os 3 pontos mais graves</h1><div class="tp"></div>`;
  const tp=$('.tp',s);
  EX[i].top.forEach((t,k)=>{tp.insertAdjacentHTML('beforeend',`<div class="c"><div class="h"><i>${k+1}</i><b>${t[0]}</b></div><div class="r"><em>Setembro</em>${t[1]}</div><div class="r"><em>Tendência de outubro (01-05)</em>${t[2]}</div><div class="imp">${t[3]}</div></div>`)});
  if(EX[i].foot&&EX[i].top.some(t=>t[3].includes('*')))tp.insertAdjacentHTML('afterend',`<div style="position:absolute;left:64px;bottom:14px;font-size:11.5px;color:var(--muted);font-weight:600">${EX[i].foot}</div>`);
}
function iniSlide(s,B,i){
  s.innerHTML=`${eyebrow(B.short,'Iniciativas')}<h1>${B.short}: o que devemos fazer</h1><div class="ini"></div>`;
  const ul=$('.ini',s);
  EX[i].ini.forEach(r=>ul.insertAdjacentHTML('beforeend',`<div class="r"><div class="ic"><svg viewBox="0 0 24 24">${IC[r[0]]||IC.target}</svg></div><div class="t"><b>${r[1]}</b><span>${r[2]}</span></div><div class="g"><em>Ganho potencial</em><strong>${r[3]}</strong></div><div class="e"><em>Esforço</em><strong>${r[4]}</strong></div></div>`));
  if(EX[i].foot)ul.insertAdjacentHTML('afterend',`<div style="position:absolute;left:64px;bottom:14px;font-size:11.5px;color:var(--muted);font-weight:600">${EX[i].foot}</div>`);
}
function build(){
  const g=DATA.grupo;
  add('Grupo','Capa',s=>{s.className='slide cover';s.innerHTML=`<div class="in"><h2>Resumo executivo por bandeira</h2><p>Setembro e tendência de outubro: insights, pontos mais graves e iniciativas</p></div><div class="k">GROWTH | CRO · OUTUBRO DE 2026</div><div class="bars"><span style="height:150px"></span><span style="height:230px"></span><span class="hi" style="height:330px"></span><span style="height:270px"></span><span style="height:410px"></span></div>`});
  add('Grupo','Grupo: atingimento',s=>{
    splitSlide(s,'Grupo','Set e Out','Só Calçados supera a meta em outubro','Oscar web, app e Esportes ficam abaixo da meta nos dois períodos; o Esportes chega a 91% em 01 a 05/10. O faturado de outubro ainda está amadurecendo.',(host)=>{const lg=H('div','legend','',host);lg.innerHTML=`<span><i style="background:var(--c-a)"></i>Setembro (01-30)</span><span><i style="background:var(--c-b)"></i>01 a 05/10</span>`;atingimento(host,{rows:g.ating});},{ptitle:'Faturado sobre a meta, %'});});
  DATA.b.forEach((B,i)=>{
    add(B.name,B.short+': panorama',s=>kpiSlide(s,B,i));
    add(B.name,B.short+': top 3 pontos graves',s=>topSlide(s,B,i));
    add(B.name,B.short+': iniciativas',s=>iniSlide(s,B,i));
  });
  add('Grupo','Iniciativas priorizadas',priSlide);
}
/* navegação */
const stage=$('#stage'),menu=$('#menu');let cur=0;const dom=[];
function mount(i){if(dom[i])return dom[i];const s=document.createElement('section');s.className='slide';s.id='s'+(i+1);stage.appendChild(s);slides[i].fn(s);dom[i]=s;return s}
function show(i,fromHash){i=Math.max(0,Math.min(slides.length-1,i));cur=i;dom.forEach(d=>d&&d.classList.remove('on'));const s=mount(i);s.classList.add('on');
  $('#count').textContent=(i+1)+' / '+slides.length;$('#prog i').style.width=((i+1)/slides.length*100)+'%';
  try{history.replaceState(null,'','#s'+(i+1))}catch(e){}
  menu.querySelectorAll('button').forEach(b=>b.classList.toggle('cur',+b.dataset.i===i));tip.style.opacity=0}
function fit(){const vp=$('#viewport');const w=vp.clientWidth,h=vp.clientHeight;const sc=Math.min(w/1280,h/720);stage.style.transform=`translate(${(w-1280*sc)/2}px,${(h-720*sc)/2}px) scale(${sc})`}
function buildMenu(){menu.innerHTML='<h3>Índice</h3>';let last='';slides.forEach((sl,i)=>{if(sl.section!==last){last=sl.section;H('button','sec',sl.section,menu).dataset.i=i;menu.lastChild.addEventListener('click',()=>{show(i);menu.hidden=true})}
  const b=H('button','',sl.label,menu);b.dataset.i=i;b.addEventListener('click',()=>{show(i);menu.hidden=true})})}
function init(){build();buildMenu();fit();addEventListener('resize',fit);
  const h=parseInt((location.hash.match(/^#s(\d+)$/)||[])[1]||'1',10)-1;show(isNaN(h)?0:h);
  $('#bPrev').onclick=()=>show(cur-1);$('#bNext').onclick=()=>show(cur+1);$('#bMenu').onclick=()=>{menu.hidden=!menu.hidden};
  $('#bTheme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
  $('#bFs').onclick=()=>{const d=document.documentElement;if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen()}else if(d.requestFullscreen){d.requestFullscreen().catch(()=>{})}};
  addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();show(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(cur-1)}else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);else if(e.key==='Escape')menu.hidden=true;else if(e.key==='m')menu.hidden=!menu.hidden});
  let tx=null;stage.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));tx=null});
  addEventListener('hashchange',()=>{const m=location.hash.match(/^#s(\d+)$/);if(m)show(parseInt(m[1],10)-1,true)});
}
init();
})();
